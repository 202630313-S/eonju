<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 점심 메뉴 추천기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #333333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .display-box {
            background-color: #fff8e1;
            border: 2px dashed #ffb74d;
            border-radius: 15px;
            padding: 40px 20px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .category {
            font-size: 14px;
            color: #f57c00;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .menu-name {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            word-break: keep-all;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            border: none;
            outline: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            width: 100%;
        }

        .btn-recommend {
            background-color: #ff7043;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 112, 67, 0.3);
        }

        .btn-recommend:hover {
            background-color: #f4511e;
        }

        .btn-recommend:active {
            transform: scale(0.98);
        }

        /* 룰렛 애니메이션 효과 */
        .spinning {
            animation: pulse 0.1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1.02); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍱 오늘 뭐 먹지?</h1>
        <p class="subtitle">결정이 어려운 당신을 위한 랜덤 점심 추천기</p>

        <div class="display-box" id="displayBox">
            <div class="category" id="categoryText">카테고리</div>
            <div class="menu-name" id="menuText">버튼을 눌러주세요!</div>
        </div>

        <div class="btn-group">
            <button class="btn-recommend" onclick="recommendMenu()">점심 메뉴 추천받기 🎲</button>
        </div>
    </div>

    <script>
        // 추천할 점심 메뉴 데이터베이스
        const menuList = [
            { name: "김치찌개", category: "한식 🍚" },
            { name: "된장찌개", category: "한식 🍚" },
            { name: "제육볶음", category: "한식 🍚" },
            { name: "비빔밥", category: "한식 🍚" },
            { name: "국밥 (돼지/순대/소머리)", category: "한식 🍚" },
            { name: "짜장면 & 짬뽕", category: "중식 🥢" },
            { name: "볶음밥", category: "중식 🥢" },
            { name: "마라탕", category: "중식 🥢" },
            { name: "돈까스", category: "일식 🍣" },
            { name: "초밥", category: "일식 🍣" },
            { name: "라멘", category: "일식 🍣" },
            { name: "우동", category: "일식 🍣" },
            { name: "파스타", category: "양식 🍝" },
            { name: "수제버거", category: "양식 🍝" },
            { name: "피자", category: "양식 🍝" },
            { name: "떡볶이 & 분식", category: "분식 떡" },
            { name: "칼국수 / 수제비", category: "면류 🍜" },
            { name: "쌀국수", category: "아시안 🌏" },
            { name: "샌드위치 / 샐러드", category: "가벼운 한끼 🥗" }
        ];

        let isSpinning = false;

        function recommendMenu() {
            if (isSpinning) return; // 이미 실행 중이면 중복 클릭 방지

            isSpinning = true;
            const displayBox = document.getElementById("displayBox");
            const menuText = document.getElementById("menuText");
            const categoryText = document.getElementById("categoryText");

            displayBox.classList.add("spinning");

            // 1초 동안 메뉴가 빠르게 바뀌는 효과
            let counter = 0;
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * menuList.length);
                menuText.textContent = menuList[tempIndex].name;
                categoryText.textContent = menuList[tempIndex].category;
                counter++;
            }, 50);

            // 1초 후 최종 결과 결정
            setTimeout(() => {
                clearInterval(interval);
                displayBox.classList.remove("spinning");

                const finalIndex = Math.floor(Math.random() * menuList.length);
                const result = menuList[finalIndex];

                categoryText.textContent = result.category;
                menuText.textContent = result.name;
                
                isSpinning = false;
            }, 1000);
        }
    </script>
</body>
</html>
